[project]
name = "smart-campus-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "redis>=5,<6",
  "qdrant-client>=1.11,<1.13", "httpx>=0.27,<1", "langchain-core>=0.3,<1",
  "langchain-text-splitters>=0.3,<1", "pypdf>=5,<7", "python-multipart>=0.0.12,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1", "mypy>=1.11,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint.per-file-ignores]
"app/services/health.py" = ["BLE001"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
